name: Waluty

permissions:
  contents: write

on:
  schedule:
    - cron: '0 12 * * *' 
  workflow_dispatch: {}

env:
  TZ: Europe/Warsaw

jobs:
  save:
    name: Save today's price guide
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run save script
        run: python3 scripts/save_price_guide.py

      - name: Commit & push (only if new files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/price_guides_* || true
          git diff --staged --quiet || (git commit -m "Add price_guide_6: $(TZ=Europe/Warsaw date +'%Y-%m-%d %H:%M %Z')" && git push)

  dispatch:
    name: Trigger workflows in target repos
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check token
        run: |
          if [ -z "${{ secrets.REPO_DISPATCH_TOKEN }}" ]; then
            echo "Secret REPO_DISPATCH_TOKEN is not set!"; exit 1
          fi

      - name: Trigger workflows in target repos
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          
          repos=(
            "BarryV94/Wartosci-walut"
            "BarryV94/kursy-kruszcow-nbp"
          )

          failures=0

          for r in "${repos[@]}"; do
            workflow_file="save-price-guide.yml"
            ref="main"
            
            # wyjatek dla repo TCGPlayer_price_guide_tcgcsv

            if [ "$r" == "BarryV94/TCGPlayer_price_guide_tcgcsv" ]; then
              workflow_file="fetch_tcgplayer.yml"
            fi
            
            # wyjatek dla repo Singles--to---product---set

            if [ "$r" == "BarryV94/Singles--to---product---set" ]; then
              workflow_file="tcgdex-sync.yml"
            fi

            # wyjątek dla repo Wartosci-walut
            if [ "$r" == "BarryV94/Wartosci-walut" ]; then
              workflow_file="save-nbp-rates.yml"
            fi
            
            # wyjątek dla repo kursy-kruszcow-nbp
            if [ "$r" == "BarryV94/kursy-kruszcow-nbp" ]; then
              workflow_file="save-nbp-minerals.yml"
            fi
            
            echo "Triggering $r -> workflow ${workflow_file} on ref ${ref} ..."
            resp=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token ${TOKEN}" \
              https://api.github.com/repos/${r}/actions/workflows/${workflow_file}/dispatches \
              -d "{\"ref\":\"${ref}\"}")

            if [ "$resp" != "204" ]; then
              echo " -> FAILED for ${r} (http ${resp})"
              failures=$((failures+1))
            else
              echo " -> OK"
            fi
            sleep 1
          done

          if [ "$failures" -ne 0 ]; then
            echo "There were ${failures} failures."; exit 1
          fi
