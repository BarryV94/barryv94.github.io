name: Dispatch Cardmarket price guide workflows

permissions:
  contents: read

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  dispatch:
    name: Trigger workflows in target repos
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check token
        run: |
          if [ -z "${{ secrets.REPO_DISPATCH_TOKEN }}" ]; then
            echo "Secret REPO_DISPATCH_TOKEN is not set!"
            exit 1
          fi

      - name: Trigger workflows in target repos
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          repos=(
            "BarryV94/MTG"
            "BarryV94/Battlespiritsaga"
            "BarryV94/Dragonballsuper"
            "BarryV94/Pokemon"
            "BarryV94/Accessories"
            "BarryV94/Cardfightvanguard"
            "BarryV94/Digimon"
            "BarryV94/Dragonborne"
            "BarryV94/Finalfantasy"
            "BarryV94/Fleshandblood"
            "BarryV94/Forceofwill"
            "BarryV94/Lorcana"
            "BarryV94/Mylittlepony"
            "BarryV94/Onepiece"
            "BarryV94/Riftbound"
            "BarryV94/Starwarsdestiny"
            "BarryV94/Starwarsunlimited"
            "BarryV94/Thespoils"
            "BarryV94/Wei-schwarz"
            "BarryV94/Wowtcg"
            "BarryV94/Yugioh"
          )

          failures=0

          for r in "${repos[@]}"; do

            # Pomijamy repozytorium, w którym znajduje się ten workflow.
            if [ "$r" = "${{ github.repository }}" ]; then
              echo "Skipping current repository: $r"
              continue
            fi

            workflow_file="save-price-guide.yml"
            ref="main"

            echo "Triggering $r -> $workflow_file on $ref ..."

            resp=$(curl -s \
              -o /dev/stderr \
              -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${r}/actions/workflows/${workflow_file}/dispatches" \
              -d "{\"ref\":\"${ref}\"}")

            if [ "$resp" != "204" ]; then
              echo " -> FAILED for ${r} (HTTP ${resp})"
              failures=$((failures + 1))
            else
              echo " -> OK"
            fi

            sleep 1
          done

          if [ "$failures" -ne 0 ]; then
            echo "There were ${failures} failures."
            exit 1
          fi
